[project]
name = "taza-rag"
version = "0.1.0"
description = "Contextual hybrid RAG for Taza trial — Dow Jones / Factiva-aligned evals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "httpx>=0.27",
  "tiktoken>=0.7",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
  "orjson>=3.10",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
taza-rag = "taza_rag.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["taza_rag*"]

[tool.setuptools.package-data]
"taza_rag.ui" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
